<div class="cmd cmd-widget #history#" data-type="info" data-subtype="string" data-template="brotherbe" data-offline="0" data-alert="0" data-printing="0" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#">
  <div class="title #hide_name#">
    <div class="cmdName">#name_display#</div>
  </div>
  <div class="content">
    <div class="bbAlert"></div>
    <div class="bbHead">
      <i class="bbIcon fas fa-print"></i>
      <span class="bbStatus"></span>
    </div>
    <div class="bbSupplies"></div>
    <div class="bbFacts"></div>
    <div class="bbFoot"></div>
  </div>
  <div class="timeCmd label label-default #history#" data-type="info"></div>
  <template>
    <div>low : 10 ({{Seuil en pour cent sous lequel un consommable passe en rouge}})</div>
    <div>facts : 0 ({{Masque les compteurs de pages}})</div>
  </template>
  <script>
    (function () {
      /* Une seule feuille de style pour toutes les tuiles du plugin, posée au
         premier rendu : le CSS d'un plugin n'est pas chargé sur le dashboard.
         Les couleurs viennent du thème, sauf celles des cartouches, qui sont
         celles des cartouches. */
      if (!document.getElementById('brotherbeWidgetCss')) {
        var css = document.createElement('style')
        css.id = 'brotherbeWidgetCss'
        css.textContent = [
          '.cmd-widget[data-template="brotherbe"]{display:flex;flex-direction:column;align-items:center;width:100%;min-width:190px}',
          '.cmd-widget[data-template="brotherbe"] .cmdName{font-size:12px;line-height:16px;font-weight:400;color:var(--txt-color)}',
          '.cmd-widget[data-template="brotherbe"] .content{display:flex;flex-direction:column;align-items:stretch;width:100%;padding:0 8px 3px;gap:4px}',

          '.cmd-widget[data-template="brotherbe"] .bbAlert{display:none;padding:3px 6px;font-size:.8em;font-weight:700;line-height:1.3;text-align:center;border-radius:var(--border-radius);background:var(--al-danger-color);color:#FFFFFF;overflow-wrap:anywhere}',
          '.cmd-widget[data-template="brotherbe"][data-alert="1"] .bbAlert{display:block}',

          '.cmd-widget[data-template="brotherbe"] .bbHead{display:flex;align-items:center;justify-content:center;gap:7px;line-height:1.2}',
          '.cmd-widget[data-template="brotherbe"] .bbIcon{font-size:1.4em;color:var(--txt-color);opacity:.8}',
          '.cmd-widget[data-template="brotherbe"][data-printing="1"] .bbIcon{color:var(--al-success-color);opacity:1}',
          '.cmd-widget[data-template="brotherbe"] .bbStatus{font-size:1.05em;font-weight:600;color:var(--txt-color)}',

          /* Une ligne par consommable : libellé, barre, pour cent. La barre
             dit plus vite que le chiffre qu'il est temps de commander. */
          '.cmd-widget[data-template="brotherbe"] .bbSupplies{display:flex;flex-direction:column;gap:3px;margin-top:2px}',
          '.cmd-widget[data-template="brotherbe"] .bbRow{display:flex;align-items:center;gap:6px;font-size:.8em;color:var(--txt-color)}',
          '.cmd-widget[data-template="brotherbe"] .bbLabel{flex:0 0 64px;text-align:right;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
          '.cmd-widget[data-template="brotherbe"] .bbBar{flex:1 1 auto;height:8px;border-radius:4px;background:var(--btnEq-default-color);overflow:hidden}',
          '.cmd-widget[data-template="brotherbe"] .bbBar > span{display:block;height:100%;border-radius:4px;transition:width .4s ease;background:var(--al-info-color)}',
          '.cmd-widget[data-template="brotherbe"] .bbRow[data-kind="black"] .bbBar > span{background:var(--txt-color);opacity:.8}',
          '.cmd-widget[data-template="brotherbe"] .bbRow[data-kind="cyan"] .bbBar > span{background:#00A3E0}',
          '.cmd-widget[data-template="brotherbe"] .bbRow[data-kind="magenta"] .bbBar > span{background:#D6007E}',
          '.cmd-widget[data-template="brotherbe"] .bbRow[data-kind="yellow"] .bbBar > span{background:#F2C500}',
          '.cmd-widget[data-template="brotherbe"] .bbRow[data-low="1"] .bbBar > span{background:var(--al-danger-color);opacity:1}',
          '.cmd-widget[data-template="brotherbe"] .bbPct{flex:0 0 auto;min-width:42px;white-space:nowrap;text-align:right;font-weight:600}',
          '.cmd-widget[data-template="brotherbe"] .bbRow[data-low="1"] .bbPct{color:var(--al-danger-color)}',

          '.cmd-widget[data-template="brotherbe"] .bbFacts{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin-top:3px}',
          '.cmd-widget[data-template="brotherbe"] .bbFact{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px}',
          '.cmd-widget[data-template="brotherbe"] .bbFactLabel{font-size:.68em;text-transform:uppercase;letter-spacing:.03em;color:var(--txt-color);opacity:.55;line-height:1.1}',
          '.cmd-widget[data-template="brotherbe"] .bbFactValue{font-size:.92em;font-weight:600;color:var(--txt-color);line-height:1.15}',

          '.cmd-widget[data-template="brotherbe"] .bbFoot{font-size:.74em;color:var(--txt-color);opacity:.6;line-height:1.2;text-align:center}',
          /* Injoignable : les dernières valeurs restent lisibles, mais ne se
             font plus passer pour des valeurs fraîches. */
          '.cmd-widget[data-template="brotherbe"][data-offline="1"] .bbSupplies,',
          '.cmd-widget[data-template="brotherbe"][data-offline="1"] .bbFacts,',
          '.cmd-widget[data-template="brotherbe"][data-offline="1"] .bbHead{opacity:.4}',
          '.cmd-widget[data-template="brotherbe"][data-offline="1"] .bbFoot{opacity:.85;font-weight:600}'
        ].join('')
        document.head.appendChild(css)
      }

      var bbLow = parseInt('#low#', 10)
      if (!domUtils.issetWidgetOptParam('#low#', 'low') || isNaN(bbLow)) { bbLow = 10 }
      var bbShowFacts = !(domUtils.issetWidgetOptParam('#facts#', 'facts') && '#facts#' == '0')

      /* Espace fine insécable pour les milliers. */
      function bbNum(_value) {
        if (_value === null || _value === undefined || _value === '' || isNaN(_value)) { return null }
        return String(Math.round(Number(_value))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ')
      }

      function bbFact(_container, _label, _value) {
        if (_value === null || _value === undefined || _value === '') { return }
        var box = document.createElement('div')
        box.className = 'bbFact'
        var label = document.createElement('div')
        label.className = 'bbFactLabel'
        label.textContent = _label
        var value = document.createElement('div')
        value.className = 'bbFactValue'
        value.textContent = _value
        box.appendChild(label)
        box.appendChild(value)
        _container.appendChild(box)
      }

      jeedom.cmd.addUpdateFunction('#id#', function (_options) {
        var cmd = document.querySelector('.cmd[data-cmd_uid="#uid#"]')
        if (!is_object(cmd)) { return }

        var data = null
        try {
          data = JSON.parse(_options.value)
        } catch (_error) {
          data = null
        }

        var status = cmd.querySelector('.bbStatus')
        var supplies = cmd.querySelector('.bbSupplies')
        var facts = cmd.querySelector('.bbFacts')
        var foot = cmd.querySelector('.bbFoot')
        var alert = cmd.querySelector('.bbAlert')

        supplies.innerHTML = ''
        facts.innerHTML = ''
        foot.textContent = ''
        alert.textContent = ''
        cmd.setAttribute('data-alert', '0')
        cmd.setAttribute('data-printing', '0')

        /* Rien reçu : surtout pas de barre vide, qui affirmerait un toner à
           zéro alors qu'on ne sait rien encore. */
        if (data === null) {
          cmd.setAttribute('data-offline', '0')
          status.textContent = '-'
          foot.textContent = '{{En attente du premier relevé}}'
          return
        }

        var offline = (Number(data.online) !== 1)
        cmd.setAttribute('data-offline', offline ? '1' : '0')
        cmd.setAttribute('data-printing', Number(data.printing) === 1 ? '1' : '0')
        status.textContent = data.status || data.model || '{{Imprimante}}'

        var list = data.supplies || []
        for (var i = 0; i < list.length; i++) {
          var item = list[i]
          var pct = Math.max(0, Math.min(100, Number(item.pct)))
          var row = document.createElement('div')
          row.className = 'bbRow'
          row.setAttribute('data-kind', String(item.kind || 'other'))
          row.setAttribute('data-low', pct <= bbLow ? '1' : '0')
          var label = document.createElement('span')
          label.className = 'bbLabel'
          label.textContent = item.label
          var bar = document.createElement('span')
          bar.className = 'bbBar'
          var fill = document.createElement('span')
          fill.style.width = pct + '%'
          bar.appendChild(fill)
          var value = document.createElement('span')
          value.className = 'bbPct'
          value.textContent = pct + ' %'
          row.appendChild(label)
          row.appendChild(bar)
          row.appendChild(value)
          supplies.appendChild(row)
        }

        if (bbShowFacts) {
          bbFact(facts, '{{Pages}}', bbNum(data.pages))
          bbFact(facts, '{{Recto verso}}', bbNum(data.duplex))
          bbFact(facts, '{{Tambour}}', bbNum(data.drum_pages) === null ? null : bbNum(data.drum_pages) + ' {{p. restantes}}')
        }

        if (data.errors && data.errors.length > 0) {
          cmd.setAttribute('data-alert', '1')
          alert.textContent = data.errors.join(' · ')
        }

        if (offline) {
          foot.textContent = '{{Imprimante injoignable}}'
        }

        jeedom.cmd.displayDuration(_options.valueDate, cmd.querySelector('.timeCmd'), '#time#')
      })

      /* display_value reste vide : la tuile lit #value#, déjà assaini côté PHP
         par json_encode et ses drapeaux hexadécimaux. */
      jeedom.cmd.refreshValue([{ cmd_id: '#id#', value: '#value#', display_value: '', valueDate: '#valueDate#', collectDate: '#collectDate#', alertLevel: '#alertLevel#', unit: '' }])
    })()
  </script>
</div>
